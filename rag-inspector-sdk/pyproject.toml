[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-inspector-sdk"
version = "0.1.0"
description = "A lightweight SDK for explicitly connecting existing RAG pipelines to RAG Inspector."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RAG Inspector Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"rag_inspector" = ["py.typed"]
